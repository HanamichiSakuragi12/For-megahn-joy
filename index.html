<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffe4e1;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            overflow-x: hidden;
        }
        #container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            z-index: 10;
            position: relative;
            max-width: 90%;
        }
        h1 { color: #d63384; margin-top: 15px; }
        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #adb5bd; color: white; position: relative; }
        
        img { 
            width: 250px; 
            height: 250px; 
            object-fit: cover; 
            border-radius: 20px; 
            border: 5px solid #ff4d6d;
        }

        /* Falling Hearts Animation */
        .heart {
            position: fixed;
            top: -10px;
            color: #ff4d6d;
            font-size: 20px;
            user-select: none;
            animation: fall linear forwards;
            z-index: 1;
        }
        @keyframes fall {
            to { transform: translateY(110vh); }
        }

        /* Date Picker Styling */
        #dateSection {
            display: none;
            margin-top: 20px;
            border-top: 2px dashed #ff4d6d;
            padding-top: 20px;
        }
        input[type="datetime-local"] {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #ff4d6d;
            font-size: 1rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body onclick="playMusic()">

    <iframe width="0" height="0" src="https://www.youtube.com/embed/45eRWpjoN8w?autoplay=1&mute=0" frameborder="0" allow="autoplay"></iframe>

    <div id="container">
        <img src="https://scontent.fmnl4-4.fna.fbcdn.net/v/t39.30808-6/484589436_1017927663721168_3398681640098736176_n.jpg?_nc_cat=100&ccb=1-7&_nc_sid=127cfc&_nc_eui2=AeGZDY-_3p301NE7CxeeJdiY5a1SeexHqvvlrVJ57Eeq-2BB4L8rNPKlq7Iub2Y434HImVTp7lZSEQ84ks7Q33Pa&_nc_ohc=QDNmTsKcB-QQ7kNvwH8g9Xm&_nc_oc=AdnCyyMEC2cl0m0nV8hIMgW41hQLT0YpF4tsrdiJF8FleG-WRvRalBxXwEdbun7gXV4&_nc_zt=23&_nc_ht=scontent.fmnl4-4.fna&_nc_gid=xHPwciGTSlId7CZzmUXHOg&oh=00_AfuVJ0IKxj2r4Xz60qCmthBp0jjDSx2rmClXdCiRPLGokg&oe=6993AF99" alt="Valentine Image">
        
        <h1 id="question">Will you be my Valentine? 💖</h1>
        
        <div class="buttons" id="mainButtons">
            <button id="yesBtn" onclick="celebrate()">Yes!</button>
            <button id="noBtn" onmouseover="moveButton()">No</button>
        </div>

        <div id="dateSection">
            <h3>When should I pick you up? 🥰</h3>
            <input type="datetime-local" id="dateInput">
            <br>
            <button id="yesBtn" onclick="confirmDate()">Confirm Date</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            const btn = document.getElementById('noBtn');
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('question').innerText = "Yay! You decorated my life! 🥰";
            document.getElementById('mainButtons').style.display = 'none';
            document.getElementById('dateSection').style.display = 'block';
            
            // Intensify hearts!
            setInterval(createHeart, 100);
        }

        function confirmDate() {
            const date = document.getElementById('dateInput').value;
            if(date) {
                alert("It's a date! Can't wait! ❤️");
            } else {
                alert("Please pick a time! I'm excited! 😍");
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
